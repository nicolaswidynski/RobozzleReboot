name: robozzle_reboot
description: A Robozzle-style robot programming puzzle game.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.1.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  uuid: ^4.6.0
  sensors_plus: ^7.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/levels_catalog.json
    - assets/robozzle_token.txt
    - assets/server.txt
