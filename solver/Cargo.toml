[package]
name = "solver"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.8"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Tests run the differential and end-to-end suites; optimize them but keep
# debug assertions on.
[profile.test]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
